services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow
      POSTGRES_DB: workflow_creator
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U workflow"], interval: 5s, timeout: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    environment:
      DATABASE_URL: postgresql://workflow:workflow@postgres:5432/workflow_creator?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      API_PORT: 4000
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
    ports: ["4000:4000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
  worker:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    command: ["npm", "run", "worker", "--workspace", "@workflow/api"]
    environment:
      DATABASE_URL: postgresql://workflow:workflow@postgres:5432/workflow_creator?schema=public
      REDIS_URL: redis://redis:6379
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy }, api: { condition: service_healthy } }
  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    environment: { NEXT_PUBLIC_API_URL: http://localhost:4000 }
    depends_on: { api: { condition: service_healthy } }
    ports: ["3000:3000"]

volumes:
  postgres_data: